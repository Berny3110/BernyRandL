<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Jeu de tirage aléatoire</title>

  <!-- Lien vers le manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Couleur de la barre d’adresse sur mobile -->
  <meta name="theme-color" content="#1976d2">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      height: 100vh;
      background-color: black;
      display: flex;
      flex-direction: column;
    }
    #result {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 75vmin;
      color: white;
      text-transform: uppercase;
      border-radius: 30px;
      margin: 20px;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
      transition: background-color 0.4s ease;
    }
    #lancer {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;               /* Beaucoup plus large */
      max-width: 500px;         /* Limite raisonnable sur grands écrans */
      padding: 28px 20px;       /* Plus haut */
      font-size: 2.2em;         /* Texte beaucoup plus gros */
      font-weight: bold;
      border: none;
      cursor: pointer;
      background: linear-gradient(145deg, #444, #222); /* Dégradé pour plus de profondeur */
      color: white;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.7), 
                  0 0 15px rgba(255,255,255,0.1) inset;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    #lancer:active {
      transform: translateX(-50%) translateY(4px) scale(0.98);
      box-shadow: 0 4px 10px rgba(0,0,0,0.7);
    }
    /* Petit effet de pulsation au chargement */
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255,255,255,0.4); }
      70% { box-shadow: 0 0 0 15px rgba(255,255,255,0); }
      100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
    }
    #lancer {
      animation: pulse 2s infinite;
    }
  </style>
</head>
<body>
  <div id="result"></div>
  <button id="lancer">Lancer</button>

  <script>
    function tirage() {
      const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      const lettre = alphabet[Math.floor(Math.random() * alphabet.length)];

      // Rouge sombre et bleu profond
      const couleurs = ["#b71c1c", "#1976d2"]; 
      const couleur = couleurs[Math.floor(Math.random() * couleurs.length)];

      const resultDiv = document.getElementById("result");
      resultDiv.textContent = lettre;
      resultDiv.style.backgroundColor = couleur;
    }

    // Tirage au chargement de la page
    tirage();

    // Clic sur le bouton
    document.getElementById("lancer").addEventListener("click", tirage);
  </script>
</body>
</html>
